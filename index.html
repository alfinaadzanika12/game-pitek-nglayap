<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitek Nglayap: Petualangan si Ayam Kampung v2.5</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }
        canvas {
            border: 6px solid #fff;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transition: all 0.5s ease;
            margin-top: 20px;
        }
        #info {
            position: absolute;
            top: 15px;
            text-align: center;
            width: 100%;
            font-size: 32px;
            font-weight: 900;
            pointer-events: none;
            font-family: 'Arial Black', Gadget, sans-serif;
            letter-spacing: 3px;
            animation: neonRainbow 4s linear infinite;
        }
        #sub-info {
            position: absolute;
            top: 65px;
            text-align: center;
            width: 100%;
            font-size: 14px;
            color: #ccc;
            font-weight: bold;
            text-shadow: 1px 1px 3px #000;
            letter-spacing: 1px;
        }
        #logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 95px;
            z-index: 10;
        }
        .game-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.5));
        }
        @keyframes neonRainbow {
            0% { color: #ff0055; text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055; }
            25% { color: #00ffcc; text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc; }
            50% { color: #ffff00; text-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00; }
            75% { color: #ff00ff; text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff; }
            100% { color: #ff0055; text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055; }
        }
    </style>
</head>
<body>

    <div id="info">PITEK NGLAYAP</div>
    <div id="sub-info">Tekan SPASI atau Ketuk Layar untuk Melompat</div>
    
    <div id="logo-container">
        <img src="logo1.png" alt="" class="game-logo">
        <img src="logo2.png" alt="" class="game-logo">
        <img src="logo3.png" alt="" class="game-logo">
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let coinScore = 0; // Skor Koin Baru
        let gameOver = false;
        
        let currentLevel = 1;
        let levelDescription = "Level 1 - Halaman Rumah: Nyantai dolo.";
        let skyGradientTop = "#87CEEB";
        let skyGradientBottom = "#E0F7FA";
        let groundColorTop = "#4CAF50";
        let groundColorBottom = "#2E7D32";

        let clouds = [
            { x: 100, y: 50, size: 30, speed: 0.5 },
            { x: 400, y: 80, size: 40, speed: 0.3 },
            { x: 700, y: 40, size: 25, speed: 0.6 }
        ];

        let particles = [];
        let coinEffects = []; // Efek kilauan saat koin diambil

        // OBJEK KOIN MELAYANG DAN HIDUP
        const koin = {
            x: canvas.width + 200,
            y: 220, // Ketinggian melayang awal
            baseY: 220, // Dasar ketinggian untuk efek naik-turun
            radius: 12,
            speed: 6,
            angle: 0, // Untuk efek melayang naik turun
            spinAngle: 0, // Untuk efek putaran koin
            active: true,
            
            draw: function() {
                if (!this.active) return;
                
                ctx.save();
                // Efek bayangan koin di udara
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#FFD700";
                
                // Menghitung animasi putaran horizontal koin menggunakan Math.abs(Math.sin)
                let spinWidth = Math.abs(Math.sin(this.spinAngle));
                
                // Gambar koin emas terluar
                ctx.fillStyle = "#FFD700";
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, this.radius * spinWidth, this.radius, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Gambar list koin lebih gelap agar kelihatan 3D hidup
                ctx.strokeStyle = "#DAA520";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Gambar lingkaran dalam koin
                ctx.fillStyle = "#FFEA00";
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, (this.radius - 4) * spinWidth, this.radius - 4, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            },
            
            update: function() {
                this.x -= this.speed;
                
                // Efek melayang hidup (Naik turun secara halus menggunakan Sinus)
                this.angle += 0.05;
                this.y = this.baseY + Math.sin(this.angle) * 15;
                
                // Kecepatan putaran koin
                this.spinAngle += 0.07;

                // Jika koin lewat layar kiri, munculkan lagi di kanan dengan tinggi acak
                if (this.x < -this.radius) {
                    this.respawn();
                }
            },

            respawn: function() {
                this.x = canvas.width + Math.random() * 600 + 200;
                // Ketinggian acak (bisa diambil saat lompat atau santai)
                this.baseY = Math.random() * 100 + 180; 
                this.active = true;
                this.speed = emakMatic.speed; // Menyeimbangkan kecepatan koin dengan musuh
            }
        };

        const pitek = {
            x: 100,
            y: 300,
            width: 45,
            height: 45,
            gravity: 0.7,
            velocity: 0,
            jumpPower: -13,
            isJumping: false,
            wingWiggle: 0,
            draw: function() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = "rgba(0,0,0,0.3)";

                ctx.fillStyle = "#FFB300";
                ctx.fillRect(this.x + 12, this.y + this.height - 5, 4, 10);
                ctx.fillRect(this.x + 28, this.y + this.height - 5, 4, 10);

                ctx.fillStyle = "#FF9800";
                ctx.beginPath();
                ctx.arc(this.x + 22, this.y + 22, 20, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = "#E53935";
                ctx.beginPath();
                ctx.arc(this.x + 25, this.y + 3, 7, 0, Math.PI * 2);
                ctx.arc(this.x + 32, this.y, 6, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = "#FFD54F";
                ctx.beginPath();
                ctx.moveTo(this.x + 38, this.y + 15);
                ctx.lineTo(this.x + 48, this.y + 20);
                ctx.lineTo(this.x + 38, this.y + 25);
                ctx.fill();
                
                ctx.fillStyle = "#FFFFFF";
                ctx.beginPath();
                ctx.arc(this.x + 30, this.y + 14, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#000000";
                ctx.beginPath();
                ctx.arc(this.x + 31, this.y + 14, 2.5, 0, Math.PI * 2);
                ctx.fill();

                this.wingWiggle += 0.2;
                let wingOffset = this.isJumping ? Math.sin(this.wingWiggle) * 5 : 0;
                ctx.fillStyle = "#FB8C00";
                ctx.beginPath();
                ctx.ellipse(this.x + 15, this.y + 24 + wingOffset, 10, 6, Math.PI/6, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            },
            jump: function() {
                if (!this.isJumping) {
                    this.velocity = this.jumpPower;
                    this.isJumping = true;
                }
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                if (this.y >= 305) {
                    this.y = 305;
                    this.velocity = 0;
                    this.isJumping = false;
                }
            }
        };

        const emakMatic = {
            x: canvas.width + 100,
            y: 315,
            width: 60,
            height: 40,
            speed: 6,
            wheelAngle: 0,
            draw: function() {
                ctx.save();
                
                if (Math.random() < 0.4 && !gameOver) {
                    particles.push({
                        x: this.x + this.width,
                        y: this.y + this.height - 5,
                        size: Math.random() * 6 + 2,
                        opacity: 1
                    });
                }

                ctx.fillStyle = "#E53935";
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + 15);
                ctx.lineTo(this.x + 45, this.y + 10);
                ctx.lineTo(this.x + 55, this.y + 30);
                ctx.lineTo(this.x, this.y + 35);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = "#FFF";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(this.x + 10, this.y + 10);
                ctx.lineTo(this.x + 15, this.y - 5);
                ctx.stroke();

                if (Math.floor(Date.now() / 150) % 2 === 0) {
                    ctx.fillStyle = "#FFEB3B";
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = "#FFEB3B";
                    ctx.beginPath();
                    ctx.arc(this.x, this.y + 18, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                ctx.fillStyle = "#673AB7"; 
                ctx.fillRect(this.x + 18, this.y - 15, 25, 25);
                
                ctx.fillStyle = "#FFCCBC"; 
                ctx.fillRect(this.x + 12, this.y - 8, 8, 8);

                ctx.fillStyle = "#FFEB3B"; 
                ctx.beginPath();
                ctx.arc(this.x + 30, this.y - 20, 10, 0, Math.PI * 2);
                ctx.fill();

                this.wheelAngle += this.speed * 0.05;
                ctx.fillStyle = "#333";
                ctx.beginPath(); ctx.arc(this.x + 12, this.y + 35, 10, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(this.x + 48, this.y + 35, 10, 0, Math.PI*2); ctx.fill();
                
                ctx.strokeStyle = "#BBB";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x + 12, this.y + 35);
                ctx.lineTo(this.x + 12 + Math.cos(this.wheelAngle)*8, this.y + 35 + Math.sin(this.wheelAngle)*8);
                ctx.moveTo(this.x + 48, this.y + 35);
                ctx.lineTo(this.x + 48 + Math.cos(this.wheelAngle)*8, this.y + 35 + Math.sin(this.wheelAngle)*8);
                ctx.stroke();
            },
            update: function() {
                this.x -= this.speed;

                if (this.x < -this.width) {
                    this.x = canvas.width + Math.random() * 400 + 150;
                    score++;
                    this.speed += 0.4;
                }
            }
        };

        function updateLevel() {
            if (score < 3) {
                currentLevel = 1;
                levelDescription = "Level 1 - Halaman Rumah: Emak baru manasin motor.";
                skyGradientTop = "#87CEEB"; skyGradientBottom = "#E0F7FA";
                groundColorTop = "#4CAF50"; groundColorBottom = "#2E7D32";
            } 
            else if (score >= 3 && score < 5) {
                if (currentLevel !== 3) { emakMatic.speed += 2; currentLevel = 3; }
                levelDescription = "Level 3 - Gang Kampung: Sore hari makin padat, Emak ngebut! ⚡";
                skyGradientTop = "#E67E22"; skyGradientBottom = "#F1C40F";
                groundColorTop = "#795548"; groundColorBottom = "#4E342E";
            } 
            else if (score >= 5 && score < 7) {
                if (currentLevel !== 5) { emakMatic.speed += 2.5; currentLevel = 5; }
                levelDescription = "Level 5 - Pasar Malam: Awas silau lampu neon dan emak makin kalap! 🎆";
                skyGradientTop = "#2C3E50"; skyGradientBottom = "#2980B9";
                groundColorTop = "#34495E"; groundColorBottom = "#2C3E50";
            }
            else if (score >= 7 && score < 10) {
                if (currentLevel !== 7) { emakMatic.speed += 3; currentLevel = 7; }
                levelDescription = "Level 7 - Jalan Layang: Badai datang! Kecepatan Emak di luar nalar! ⛈️";
                skyGradientTop = "#111111"; skyGradientBottom = "#444444";
                groundColorTop = "#555555"; groundColorBottom = "#222222";
            } 
            else if (score >= 10) {
                if (currentLevel !== 10) { emakMatic.speed += 4; currentLevel = 10; }
                levelDescription = "Level 10 - DIMENSI LAIN: Kiamat Matic! Sein Kiri Belok Kanan Maksimal! 🔥👹";
                skyGradientTop = "#6A057F"; skyGradientBottom = "#FF1493";
                groundColorTop = "#220033"; groundColorBottom = "#110022";
            }
        }

        function drawEnvironment() {
            let skyGrad = ctx.createLinearGradient(0, 0, 0, 350);
            skyGrad.addColorStop(0, skyGradientTop);
            skyGrad.addColorStop(1, skyGradientBottom);
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, 350);

            ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
            clouds.forEach(cloud => {
                if (!gameOver) cloud.x -= cloud.speed;
                if (cloud.x < -100) cloud.x = canvas.width + 50;
                
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size*0.6, cloud.y - cloud.size*0.2, cloud.size*0.8, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size*1.2, cloud.y, cloud.size*0.6, 0, Math.PI * 2);
                ctx.fill();
            });

            if (currentLevel === 7 && Math.random() < 0.02) {
                ctx.fillStyle = "rgba(255,255,255,0.8)";
                ctx.fillRect(0,0,canvas.width,canvas.height);
            }

            let groundGrad = ctx.createLinearGradient(0, 350, 0, canvas.height);
            groundGrad.addColorStop(0, groundColorTop);
            groundGrad.addColorStop(1, groundColorBottom);
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, 350, canvas.width, 50);

            ctx.fillStyle = "rgba(255,255,255,0.4)";
            for (let i = 0; i < canvas.width; i += 80) {
                let offset = gameOver ? 0 : (Math.floor(Date.now() / 20) % 80);
                ctx.fillRect(i - offset, 370, 40, 5);
            }

            // Partikel Asap Motor
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += 1;
                p.y -= 0.5;
                p.opacity -= 0.02;
                ctx.fillStyle = `rgba(200, 200, 200, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
                if (p.opacity <= 0) particles.splice(i, 1);
            }

            // Animasi Efek Ledakan Koin Emas didapat
            for (let i = coinEffects.length - 1; i >= 0; i--) {
                let ce = coinEffects[i];
                ce.x += ce.vx;
                ce.y += ce.vy;
                ce.alpha -= 0.04;
                ctx.fillStyle = `rgba(255, 215, 0, ${ce.alpha})`;
                ctx.beginPath();
                ctx.arc(ce.x, ce.y, ce.size, 0, Math.PI*2);
                ctx.fill();
                if (ce.alpha <= 0) coinEffects.splice(i, 1);
            }
        }

        function checkCollision() {
            // Tabrakan dengan Emak Matic (Kalah)
            let pitekHitbox = { x: pitek.x + 5, y: pitek.y + 5, w: pitek.width - 10, h: pitek.height - 5 };
            let emakHitbox = { x: emakMatic.x + 5, y: emakMatic.y + 2, w: emakMatic.width - 10, h: emakMatic.height - 4 };

            if (
                pitekHitbox.x < emakHitbox.x + emakHitbox.w &&
                pitekHitbox.x + pitekHitbox.w > emakHitbox.x &&
                pitekHitbox.y < emakHitbox.y + emakHitbox.h &&
                pitekHitbox.y + pitekHitbox.h > emakHitbox.y
            ) {
                gameOver = true;
            }

            // Tabrakan dengan Koin Melayang (Dapat Poin Koin)
            if (koin.active) {
                // Mencari jarak titik tengah Pitek ke titik tengah Koin
                let pitekCenterX = pitek.x + pitek.width / 2;
                let pitekCenterY = pitek.y + pitek.height / 2;
                
                let distX = Math.abs(pitekCenterX - koin.x);
                let distY = Math.abs(pitekCenterY - koin.y);
                
                // Jika bersentuhan (menggunakan perhitungan radius objek)
                if (distX < (pitek.width/2 + koin.radius) && distY < (pitek.height/2 + koin.radius)) {
                    koin.active = false;
                    coinScore += 1; // Tambah skor koin!
                    
                    // Buat efek kilauan koin pecah/hidup
                    for(let i=0; i<8; i++){
                        coinEffects.push({
                            x: koin.x,
                            y: koin.y,
                            vx: (Math.random() - 0.5) * 6,
                            vy: (Math.random() - 0.5) * 6,
                            size: Math.random() * 4 + 2,
                            alpha: 1
                        });
                    }
                    
                    // Munculkan lagi koin baru di kanan
                    setTimeout(() => { koin.respawn(); }, 300);
                }
            }
        }

        function drawUI() {
            // Papan Skor yang Diperluas (Muat Jarak & Koin)
            ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
            ctx.fillRect(10, 10, 340, 90);
            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
            ctx.strokeRect(10, 10, 340, 90);

            ctx.fillStyle = "#FFF";
            ctx.font = "bold 16px 'Segoe UI', Arial";
            ctx.textAlign = "left";
            ctx.fillText(`🐔 Jarak Nglayap : ${score} m`, 25, 35);
            
            ctx.fillStyle = "#FFD700"; // Warna emas koin
            ctx.fillText(`🪙 Koin Dikoleksi : ${coinScore} Bijis`, 25, 60);
            
            ctx.font = "500 13px 'Segoe UI', Arial";
            ctx.fillStyle = "#FFEB3B";
            ctx.fillText(levelDescription, 25, 85);

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#FF1744";
                ctx.font = "bold 38px 'Segoe UI', Arial";
                ctx.textAlign = "center";
                ctx.shadowBlur = 20;
                ctx.shadowColor = "#FF1744";
                ctx.fillText("PITEK LEBUR DITABRAK EMAK!", canvas.width / 2, canvas.height / 2 - 40);
                
                ctx.shadowBlur = 0; 
                ctx.fillStyle = "#FFF";
                ctx.font = "18px Arial";
                ctx.fillText(`Skor Jarak: ${score}m  |  Total Koin Didapat: ${coinScore}`, canvas.width / 2, canvas.height / 2 + 10);
                
                ctx.fillStyle = "#00E676";
                ctx.font = "bold 16px Arial";
                ctx.fillText("Tekan SPASI atau TAP LAYAR untuk Membalas Dendam!", canvas.width / 2, canvas.height / 2 + 65);
            }
        }

        function resetGame() {
            score = 0;
            coinScore = 0; // Reset koin
            gameOver = false;
            currentLevel = 1;
            pitek.y = 305;
            pitek.velocity = 0;
            emakMatic.x = canvas.width + 100;
            emakMatic.speed = 6.5; 
            particles = [];
            coinEffects = [];
            koin.respawn();
            updateLevel();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawEnvironment();

            if (!gameOver) {
                pitek.update();
                emakMatic.update();
                koin.update(); // Update koin
                updateLevel(); 
                checkCollision();
            }

            koin.draw(); // Gambar koin melayang
            pitek.draw();
            emakMatic.draw();
            drawUI();

            requestAnimationFrame(gameLoop);
        }

        window.addEventListener("keydown", function(e) {
            if (e.code === "Space") {
                e.preventDefault(); 
                if (gameOver) resetGame();
                else pitek.jump();
            }
        });

        canvas.addEventListener("touchstart", function(e) {
            e.preventDefault();
            if (gameOver) resetGame();
            else pitek.jump();
        });

        canvas.addEventListener("mousedown", function() {
            if (gameOver) resetGame();
            else pitek.jump();
        });

        resetGame();
        gameLoop();
    </script>
</body>
</html>
